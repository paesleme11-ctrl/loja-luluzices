<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lista de Presentes</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    :root{--rose:#d6336c;--gold:#e8c766;--cream:#fff9f5;--ink:#281d20;--muted:#8d7b80;--line:#f0e1e3;--green:#25815f}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px 'DM Sans',sans-serif}.wrap{max-width:940px;margin:auto;padding:24px 16px 60px}.hero{text-align:center;padding:22px 14px 20px}.hero .mark{font-size:36px}.hero h1{font:34px 'DM Serif Display',serif;margin:8px 0}.hero p{margin:0;color:var(--muted)}.guest{max-width:450px;margin:14px auto 22px}.guest label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.guest input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.gift{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 6px 18px #5127380b}.gift img{width:100%;aspect-ratio:1.2;object-fit:cover;background:#f6ebeb}.body{padding:13px}.body h2{font-size:16px;margin:0 0 6px}.body p{color:var(--muted);font-size:12px;margin:4px 0}.price{font-weight:700;color:var(--rose);font-size:15px;margin:9px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions a,.actions button{flex:1;text-align:center;text-decoration:none;border:0;border-radius:8px;padding:9px 10px;font:700 12px 'DM Sans',sans-serif;cursor:pointer}.link{background:#fff;color:var(--rose);border:1px solid var(--rose)!important}.reserve{background:var(--rose);color:#fff}.qty{width:72px;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit}.done{opacity:.7}.done .status{color:var(--green);font-weight:700}.empty,.loading{text-align:center;padding:35px;color:var(--muted);line-height:1.6}.msg{min-height:18px;margin:0 0 12px;text-align:center;color:var(--green);font-size:13px}.key{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px auto 0;color:var(--muted);font-size:12px}.key button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 9px;cursor:pointer}@media(max-width:520px){.wrap{padding:12px 12px 40px}.hero h1{font-size:29px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.body{padding:10px}.body h2{font-size:14px}.actions{gap:5px}.actions a,.actions button{padding:8px 5px;font-size:11px}.qty{width:58px}}
  </style>
</head>
<body><main class="wrap">
  <header class="hero"><div class="mark">🎁</div><h1 id="title">Lista de Presentes</h1><p id="subtitle"></p><div class="key" id="pixKeyRow" style="display:none">Chave Pix: <b id="pixKey"></b><button onclick="copyPixKey()">Copiar</button></div></header>
  <div class="guest"><label for="guestName">Seu nome</label><input id="guestName" maxlength="80" placeholder="Como podemos identificar seu presente?"></div>
  <div id="message" class="loading">Carregando a lista…</div><div id="items" class="grid"></div>
</main>
<script>
const firebaseConfig={apiKey:"AIzaSyBXbwnfpPIC9qRLsXRDcIHyGe5DmptYGzM",authDomain:"luluzices-4254e.firebaseapp.com",projectId:"luluzices-4254e",storageBucket:"luluzices-4254e.firebasestorage.app",messagingSenderId:"328419813225",appId:"1:328419813225:web:6f168623f3edd148ee7ff8"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),listaId=new URLSearchParams(location.search).get('l');let lista=null;
const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}function msg(text,error=false){$('message').textContent=text;$('message').style.color=error?'#b42336':'var(--muted)';}
async function init(){if(!listaId)return msg('Link da lista inválido.',true);try{const ref=db.collection('listas').doc(listaId),snap=await ref.get();if(!snap.exists)return msg('Esta lista não foi encontrada.',true);lista=snap.data();$('title').textContent=lista.nome||'Lista de Presentes';$('subtitle').textContent=lista.tipo?`Celebre com a gente: ${lista.tipo}`:'Escolha um presente e ajude a tornar esse momento especial.';if(lista.colorPrimary)document.documentElement.style.setProperty('--rose',lista.colorPrimary);if(lista.colorSecondary)document.documentElement.style.setProperty('--gold',lista.colorSecondary);if(lista.chavePix){$('pixKey').textContent=lista.chavePix;$('pixKeyRow').style.display='flex';}db.collection('listas').doc(listaId).collection('itens').orderBy('createdAt','asc').onSnapshot(renderItems,()=>msg('Não foi possível carregar os presentes.',true));}catch(e){console.error(e);msg('Não foi possível abrir esta lista.',true);}}
function renderItems(snap){$('message').textContent='';if(snap.empty){$('items').innerHTML='<div class="empty">Esta lista ainda não tem presentes cadastrados.</div>';return;}$('items').innerHTML=snap.docs.map(doc=>{const x=doc.data(),total=Math.max(1,Number(x.quantidade)||1),claimed=Number(x.reservado)||0,available=Math.max(0,total-claimed),pix=x.tipoPagamento!=='link',kind=pix?`${money(x.valorPix)} no Pix`:'Presente com link do produto';if(!available)return `<article class="gift done"><img src="${esc(x.imagemUrl||'')}" alt="${esc(x.nome)}"><div class="body"><h2>${esc(x.nome)}</h2><div class="price">${kind}</div><p class="status">✓ Todos escolhidos (${claimed}/${total})</p></div></article>`;const options=Array.from({length:available},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');const buyLink=!pix&&x.linkProduto?`<a class="link" href="${esc(x.linkProduto)}" target="_blank" rel="noopener noreferrer">Ver produto</a>`:'';return `<article class="gift" id="gift-${doc.id}"><img src="${esc(x.imagemUrl||'')}" alt="${esc(x.nome)}"><div class="body"><h2>${esc(x.nome)}</h2><p>Disponíveis: ${available} de ${total}</p><div class="price">${kind}</div><div class="actions">${buyLink}<select class="qty" id="qty-${doc.id}" aria-label="Quantidade">${options}</select><button class="reserve" onclick="chooseGift('${doc.id}')">${pix?'Vou presentear':'Já comprei'}</button></div></div></article>`;}).join('');}
async function chooseGift(id){const guest=$('guestName').value.trim();if(!guest){$('guestName').focus();return msg('Digite seu nome antes de escolher um presente.',true);}const qty=Number($(`qty-${id}`).value)||1,ref=db.collection('listas').doc(listaId).collection('itens').doc(id),button=document.querySelector(`#gift-${CSS.escape(id)} .reserve`);if(button)button.disabled=true;try{await db.runTransaction(async tx=>{const snap=await tx.get(ref);if(!snap.exists)throw new Error('Esse presente não está mais disponível.');const data=snap.data(),total=Math.max(1,Number(data.quantidade)||1),claimed=Number(data.reservado)||0;if(claimed+qty>total)throw new Error('Outra pessoa acabou de escolher parte desse presente. Atualize a lista e tente novamente.');const reservas=Array.isArray(data.reservas)?data.reservas.slice():[];reservas.push({nome:guest,quantidade:qty,createdAt:Date.now()});tx.update(ref,{reservado:claimed+qty,reservas});});msg('Obrigado! Sua escolha foi registrada 💝');}catch(e){msg(e.message||'Não foi possível registrar sua escolha.',true);}finally{if(button)button.disabled=false;}}
async function copyPixKey(){try{await navigator.clipboard.writeText(lista.chavePix);$('pixKeyRow').querySelector('button').textContent='Copiada!';}catch(e){prompt('Copie a chave Pix:',lista.chavePix);}}init();
</script></body></html>
