<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerenciar Lista de Presentes</title>
<style>
  :root{ --p:#d6336c; --bg:#faf7f5; --card:#fff; --text:#2b2226; --muted:#8a7a80; --border:#eee0e2; --ok:#2f9e44; --danger:#c0392b; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
  header{background:linear-gradient(135deg,var(--p),#a61e4d);color:#fff;padding:20px}
  header h1{margin:0;font-size:1.15rem}
  header .sub{opacity:.9;font-size:.85rem}
  main{max-width:600px;margin:0 auto;padding:18px 14px 60px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}
  label{display:block;font-size:.82rem;color:var(--muted);margin:10px 0 4px}
  input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:.92rem}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .toggle{display:flex;gap:8px;margin-top:6px}
  .toggle button{flex:1;padding:10px;border-radius:9px;border:1px solid var(--p);background:#fff;color:var(--p);cursor:pointer;font-size:.85rem;font-weight:600}
  .toggle button.active{background:var(--p);color:#fff}
  .btn{background:var(--p);color:#fff;border:none;padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer;font-size:.9rem;width:100%}
  .btn.danger{background:var(--danger);width:auto;padding:8px 12px;font-size:.8rem}
  .item{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .item img,.item .tile{width:44px;height:44px;object-fit:cover;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
  .item b{font-size:.92rem}
  .item .detail{font-size:.8rem;color:var(--muted);margin-top:3px}
  .badge{font-size:.72rem;padding:2px 9px;border-radius:20px;font-weight:700}
  .badge.free{background:#e6f8ea;color:var(--ok)}
  .badge.taken{background:#fdecea;color:var(--danger)}
  .hidden{display:none !important}
  #access-denied,#loading{padding:80px 20px;text-align:center;color:var(--muted)}
  .msg{font-size:.85rem;padding:8px 12px;border-radius:8px;margin-top:8px}
  .msg.error{background:#fdecea;color:var(--danger)}
  .msg.ok{background:#e6f8ea;color:var(--ok)}
  .catalog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;max-height:280px;overflow-y:auto}
  .cat-opt{border:2px solid transparent;border-radius:10px;padding:6px;text-align:center;cursor:pointer;background:#faf2f4}
  .cat-opt.selected{border-color:var(--p)}
  .cat-opt img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:8px}
  .cat-opt .nm{font-size:.72rem;margin-top:4px;line-height:1.2}
  .icon-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
  .icon-opt{aspect-ratio:1/1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;cursor:pointer;border:2px solid transparent;position:relative}
  .icon-opt.selected{border-color:var(--p)}
  .icon-opt span.lbl{position:absolute;bottom:2px;font-size:.6rem;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
</style>
</head>
<body>

<div id="loading">Carregando...</div>
<div id="access-denied" class="hidden"><h2>Link inválido</h2><p>Verifique se você abriu o link completo que recebeu.</p></div>

<div id="app" class="hidden">
  <header>
    <h1 id="l-nome">Lista de presentes</h1>
    <div class="sub">Gerencie os itens da sua lista — o que o convidado escolher some automaticamente.</div>
  </header>
  <main>
    <div class="card">
      <h2 style="margin-top:0">Chave Pix da lista</h2>
      <p style="color:var(--muted);font-size:.85rem;margin-top:-6px">Uma única chave, usada em todos os itens.</p>
      <input id="l-pix" placeholder="email, celular ou chave aleatória">
      <button class="btn" style="margin-top:10px" onclick="salvarPix()">Salvar chave Pix</button>
      <div id="pix-msg"></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">Adicionar item</h2>
      <div class="toggle">
        <button id="modo-catalogo" class="active" onclick="setModo('catalogo')">📦 Catálogo</button>
        <button id="modo-custom" onclick="setModo('custom')">✏️ Personalizado</button>
      </div>

      <div id="painel-catalogo">
        <div id="catalog-grid" class="catalog-grid"></div>
      </div>
      <div id="painel-custom" class="hidden">
        <label>Escolha um ícone</label>
        <div id="icon-picker" class="icon-picker"></div>
      </div>

      <label>Nome do item</label>
      <input id="i-nome" placeholder="Jogo de panelas">
      <div class="row">
        <div><label>Valor sugerido</label><input id="i-valor" placeholder="R$ 100"></div>
        <div><label>Quantidade desejada</label><input id="i-qtd" type="number" min="1" value="1"></div>
      </div>

      <button class="btn" style="margin-top:14px" onclick="addItem()">+ Adicionar à lista</button>
      <div id="form-msg"></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">Itens cadastrados</h2>
      <div id="item-list"></div>
    </div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, collection, addDoc, deleteDoc, updateDoc, onSnapshot, getDocs
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBXbwnfpPIC9qRLsXRDcIHyGe5DmptYGzM",
  authDomain: "luluzices-4254e.firebaseapp.com",
  projectId: "luluzices-4254e",
  storageBucket: "luluzices-4254e.firebasestorage.app",
  messagingSenderId: "328419813225",
  appId: "1:328419813225:web:6f168623f3edd148ee7ff8"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(location.search);
const listaId = params.get("l");
const token = params.get("t");

const ICONS = [
  { key: "casa", emoji: "🏠", label: "Casa", color: "#e8c9a0" },
  { key: "cozinha", emoji: "🍳", label: "Cozinha", color: "#f6b26b" },
  { key: "eletro", emoji: "🔌", label: "Eletrônicos", color: "#8ab4e8" },
  { key: "viagem", emoji: "✈️", label: "Viagem", color: "#7fc9e0" },
  { key: "luadmel", emoji: "💑", label: "Lua de mel", color: "#f2a6c1" },
  { key: "bebe", emoji: "🍼", label: "Bebê", color: "#f7c6d9" },
  { key: "vinho", emoji: "🍷", label: "Vinho", color: "#a94464" },
  { key: "livros", emoji: "📚", label: "Livros", color: "#7fae7f" },
  { key: "jardim", emoji: "🌿", label: "Jardim", color: "#8fbf6f" },
  { key: "pet", emoji: "🐾", label: "Pet", color: "#c9a97e" },
  { key: "moda", emoji: "👗", label: "Moda", color: "#b98fd1" },
  { key: "festa", emoji: "🎉", label: "Festa", color: "#e8c766" },
  { key: "presente", emoji: "🎁", label: "Surpresa", color: "#d6336c" }
];

let modoAtual = "catalogo";
let iconeSelecionado = ICONS[0].key;
let catalogoItens = [];
let catalogoSelecionado = null;

window.setModo = function (modo) {
  modoAtual = modo;
  document.getElementById("modo-catalogo").classList.toggle("active", modo === "catalogo");
  document.getElementById("modo-custom").classList.toggle("active", modo === "custom");
  document.getElementById("painel-catalogo").classList.toggle("hidden", modo !== "catalogo");
  document.getElementById("painel-custom").classList.toggle("hidden", modo !== "custom");
};

function renderIconPicker() {
  document.getElementById("icon-picker").innerHTML = ICONS.map(ic => `
    <div class="icon-opt ${ic.key === iconeSelecionado ? 'selected' : ''}" style="background:${ic.color}"
      onclick="selecionarIcone('${ic.key}')">${ic.emoji}<span class="lbl">${ic.label}</span></div>
  `).join("");
}
window.selecionarIcone = function (key) {
  iconeSelecionado = key;
  catalogoSelecionado = null;
  renderIconPicker();
};

async function carregarCatalogo() {
  const snap = await getDocs(collection(db, "catalogo"));
  catalogoItens = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderCatalogGrid();
}

function renderCatalogGrid() {
  const el = document.getElementById("catalog-grid");
  if (!catalogoItens.length) { el.innerHTML = "<p style='color:var(--muted);font-size:.82rem;grid-column:1/-1'>Nenhum produto no catálogo ainda.</p>"; return; }
  el.innerHTML = catalogoItens.map(c => `
    <div class="cat-opt ${catalogoSelecionado?.id === c.id ? 'selected' : ''}" onclick="selecionarCatalogo('${c.id}')">
      <img src="${c.imagemUrl}">
      <div class="nm">${c.nome}</div>
    </div>
  `).join("");
}
window.selecionarCatalogo = function (id) {
  catalogoSelecionado = catalogoItens.find(c => c.id === id);
  document.getElementById("i-nome").value = catalogoSelecionado.nome;
  renderCatalogGrid();
};

async function init() {
  if (!listaId || !token) return denied();
  try {
    const tokenSnap = await getDoc(doc(db, "listaAccess", token));
    if (!tokenSnap.exists() || tokenSnap.data().listaId !== listaId) return denied();

    const listaSnap = await getDoc(doc(db, "listas", listaId));
    if (!listaSnap.exists()) return denied();
    const ld = listaSnap.data();
    document.getElementById("l-nome").textContent = ld.nome || "Lista de presentes";
    if (ld.chavePix) document.getElementById("l-pix").value = ld.chavePix;

    document.getElementById("loading").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    renderIconPicker();
    await carregarCatalogo();
    listenItens();
  } catch (e) { denied(); }
}

function denied() {
  document.getElementById("loading").classList.add("hidden");
  document.getElementById("access-denied").classList.remove("hidden");
}

window.salvarPix = async function () {
  const msg = document.getElementById("pix-msg");
  const chave = document.getElementById("l-pix").value.trim();
  if (!chave) { msg.innerHTML = '<div class="msg error">Digite uma chave Pix.</div>'; return; }
  try {
    await updateDoc(doc(db, "listas", listaId), { chavePix: chave });
    msg.innerHTML = '<div class="msg ok">Chave Pix salva!</div>';
  } catch (e) {
    msg.innerHTML = `<div class="msg error">Erro: ${e.message}</div>`;
  }
};

function listenItens() {
  onSnapshot(collection(db, "listas", listaId, "itens"), (snap) => {
    const el = document.getElementById("item-list");
    if (snap.empty) { el.innerHTML = "<p style='color:var(--muted)'>Nenhum item ainda.</p>"; return; }
    el.innerHTML = snap.docs.map(d => {
      const i = d.data();
      const reservas = i.reservas || [];
      const qtd = i.quantidadeDesejada || 1;
      const cheio = reservas.length >= qtd;
      const tag = cheio
        ? `<span class="badge taken">completo (${reservas.length}/${qtd})</span>`
        : `<span class="badge free">${reservas.length}/${qtd} escolhido(s)</span>`;
      const nomes = reservas.map(r => r.nome).join(", ");
      const ic = ICONS.find(x => x.key === i.icone);
      const thumb = i.imagemUrl
        ? `<img src="${i.imagemUrl}">`
        : `<div class="tile" style="background:${(ic || ICONS[0]).color}">${(ic || ICONS[0]).emoji}</div>`;
      return `<div class="item">
        ${thumb}
        <div style="flex:1"><b>${i.nome}</b><div class="detail">${i.valorSugerido || ""} · ${tag}${nomes ? " · " + nomes : ""}</div></div>
        <button class="btn danger" onclick="removerItem('${d.id}')">Excluir</button>
      </div>`;
    }).join("");
  });
}

window.addItem = async function () {
  const msg = document.getElementById("form-msg");
  const nome = document.getElementById("i-nome").value.trim();
  if (!nome) { msg.innerHTML = '<div class="msg error">Dê um nome ao item.</div>'; return; }

  const qtd = Math.max(1, parseInt(document.getElementById("i-qtd").value, 10) || 1);
  const data = {
    nome,
    valorSugerido: document.getElementById("i-valor").value.trim(),
    quantidadeDesejada: qtd,
    reservas: [],
    createdAt: Date.now()
  };
  if (modoAtual === "catalogo" && catalogoSelecionado) {
    data.imagemUrl = catalogoSelecionado.imagemUrl;
  } else {
    data.icone = iconeSelecionado;
  }

  try {
    await addDoc(collection(db, "listas", listaId, "itens"), data);
    document.getElementById("i-nome").value = "";
    document.getElementById("i-valor").value = "";
    document.getElementById("i-qtd").value = "1";
    catalogoSelecionado = null;
    renderCatalogGrid();
    msg.innerHTML = "";
  } catch (e) {
    msg.innerHTML = `<div class="msg error">Erro: ${e.message}</div>`;
  }
};

window.removerItem = async function (itemId) {
  if (!confirm("Excluir este item da lista?")) return;
  await deleteDoc(doc(db, "listas", listaId, "itens", itemId));
};

init();
</script>
</body>
</html>
